<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중학 사회 1-2 핵심 퀴즈 (VII~XII단원)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .unit-chip {
      transition: all 0.15s ease;
    }
    .unit-chip.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .option-btn {
      transition: all 0.15s ease;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #3b82f6;
      background-color: #eff6ff;
    }
    iframe[src*="netlify"],
    div[id*="netlify"],
    div[class*="netlify"],
    #netlify-identity-widget,
    .netlify-identity-widget,
    [data-netlify-deploy-id] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
    }
  </style>
  <script>
    (function() {
      const hideHostBanners = () => {
        document.querySelectorAll('iframe, div, aside').forEach(el => {
          const id = (el.id || '').toLowerCase();
          const cls = (typeof el.className === 'string' ? el.className : '').toLowerCase();
          const src = (el.src || '').toLowerCase();
          if (id.includes('netlify') || cls.includes('netlify') || src.includes('netlify')) {
            el.remove();
          }
        });
      };
      const observer = new MutationObserver(hideHostBanners);
      window.addEventListener('DOMContentLoaded', () => {
        hideHostBanners();
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div>
        <h1 class="text-base sm:text-lg font-bold text-slate-900">중학 사회 1-2 핵심 퀴즈</h1>
        <p class="text-xs text-slate-500">VII. 인간과 사회생활 ~ XII. 인권과 기본권</p>
      </div>
      <button onclick="openWrongNotes()" class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition">
        <span>오답노트</span>
        <span id="wrong-count-badge" class="bg-rose-500 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-5 space-y-4">

    <!-- 설정 패널 -->
    <section id="settings-panel" class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-4">
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-500">출제 단원 (복수 선택 가능)</span>
          <button onclick="toggleAllUnits()" id="toggle-all-btn" class="text-xs font-bold text-blue-600 hover:underline">
            전체 해제
          </button>
        </div>
        <div id="unit-chips" class="flex flex-wrap gap-1.5">
          <button type="button" data-unit="VII" onclick="toggleUnit('VII')" class="unit-chip active text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
            VII. 인간과 사회생활
          </button>
          <button type="button" data-unit="VIII" onclick="toggleUnit('VIII')" class="unit-chip active text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
            VIII. 다양한 문화의 이해
          </button>
          <button type="button" data-unit="IX" onclick="toggleUnit('IX')" class="unit-chip active text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
            IX. 민주주의와 시민
          </button>
          <button type="button" data-unit="X" onclick="toggleUnit('X')" class="unit-chip active text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
            X. 정치과정과 시민 참여
          </button>
          <button type="button" data-unit="XI" onclick="toggleUnit('XI')" class="unit-chip active text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
            XI. 일상생활과 법
          </button>
          <button type="button" data-unit="XII" onclick="toggleUnit('XII')" class="unit-chip active text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
            XII. 인권과 기본권
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <span class="block text-xs font-bold text-slate-500 mb-1.5">문제 유형</span>
          <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-lg">
            <button type="button" onclick="setQuestionType('mixed')" id="type-mixed" class="type-btn bg-white text-blue-600 shadow-2xs text-xs font-bold py-1.5 rounded-md">
              혼합
            </button>
            <button type="button" onclick="setQuestionType('mc')" id="type-mc" class="type-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">
              객관식
            </button>
            <button type="button" onclick="setQuestionType('sa')" id="type-sa" class="type-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">
              단답·빈칸
            </button>
          </div>
        </div>

        <div>
          <span class="block text-xs font-bold text-slate-500 mb-1.5">문항 수 (5의 배수)</span>
          <div class="grid grid-cols-6 gap-1 bg-slate-100 p-1 rounded-lg">
            <button type="button" onclick="setTargetCount(5)" data-count="5" class="count-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">5</button>
            <button type="button" onclick="setTargetCount(10)" data-count="10" class="count-btn bg-white text-blue-600 shadow-2xs text-xs font-bold py-1.5 rounded-md">10</button>
            <button type="button" onclick="setTargetCount(15)" data-count="15" class="count-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">15</button>
            <button type="button" onclick="setTargetCount(20)" data-count="20" class="count-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">20</button>
            <button type="button" onclick="setTargetCount(25)" data-count="25" class="count-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">25</button>
            <button type="button" onclick="setTargetCount(30)" data-count="30" class="count-btn text-slate-600 text-xs font-medium py-1.5 rounded-md">30</button>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
        <span id="unit-warning" class="text-xs text-rose-600 font-medium hidden">최소 1개 단원을 선택하세요.</span>
        <span id="pool-notice" class="text-xs text-slate-500"></span>
        <button onclick="startNewQuiz()" class="ml-auto w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-lg transition">
          퀴즈 시작하기
        </button>
      </div>
    </section>

    <!-- 진행 상태 -->
    <section id="progress-section" class="bg-white rounded-2xl border border-slate-200 px-4 py-3 space-y-2">
      <div class="flex items-center justify-between text-xs font-bold">
        <div class="flex items-center gap-2">
          <span class="text-blue-600" id="progress-label">1 / 10</span>
          <span class="text-slate-400">|</span>
          <span class="text-slate-600 font-medium" id="current-unit-tag">VII. 인간과 사회생활</span>
        </div>
        <div class="text-slate-700">
          정답 <span id="score-correct" class="text-emerald-600">0</span>개
        </div>
      </div>
      <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-blue-600 h-full rounded-full transition-all duration-200" style="width: 10%;"></div>
      </div>
    </section>

    <!-- 문제 카드 -->
    <section id="quiz-card" class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 space-y-5">
      <div class="flex items-center gap-2">
        <span id="q-type-badge" class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">객관식</span>
      </div>

      <h2 id="question-text" class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed"></h2>

      <!-- 객관식 선지 -->
      <div id="mc-options" class="space-y-2"></div>

      <!-- 단답형/빈칸 입력 -->
      <div id="sa-area" class="hidden space-y-2">
        <div class="flex gap-2">
          <input type="text" id="sa-input" placeholder="정답을 입력하세요"
            onkeydown="if(event.key==='Enter') submitShortAnswer()"
            class="flex-1 border border-slate-300 focus:border-blue-500 focus:outline-none rounded-lg px-3.5 py-2.5 text-sm font-medium" />
          <button id="sa-submit-btn" onclick="submitShortAnswer()"
            class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2.5 rounded-lg text-sm shrink-0">
            확인
          </button>
        </div>
        <p class="text-xs text-slate-400">띄어쓰기 없이 핵심 단어만 입력해도 정답 처리됩니다.</p>
      </div>

      <!-- 피드백 박스 -->
      <div id="feedback-box" class="hidden rounded-xl p-4 space-y-2 border text-sm">
        <div class="flex items-center justify-between">
          <span id="feedback-title" class="font-bold text-base"></span>
          <span id="feedback-answer" class="text-xs font-bold px-2 py-0.5 rounded bg-white/80"></span>
        </div>
        <p id="feedback-explanation" class="text-slate-700 leading-relaxed"></p>
        <p class="text-xs text-slate-600 pt-1 border-t border-black/5">
          <strong>핵심 포인트:</strong> <span id="feedback-tip"></span>
        </p>
      </div>

      <!-- 다음 버튼 -->
      <div id="next-action-area" class="hidden pt-1 flex justify-end">
        <button id="next-btn" onclick="handleNextStep()"
          class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition">
          다음 문제
        </button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="hidden bg-white rounded-2xl border border-slate-200 p-6 text-center space-y-5">
      <div class="space-y-1">
        <h2 class="text-xl font-bold text-slate-900">퀴즈 완료</h2>
        <p class="text-xs sm:text-sm text-slate-500">풀이 결과입니다.</p>
      </div>

      <div class="grid grid-cols-3 gap-2.5 max-w-sm mx-auto">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
          <div class="text-xs text-slate-500">총 문항</div>
          <div class="text-lg font-bold text-slate-800 mt-0.5" id="res-total">10</div>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <div class="text-xs text-emerald-600">정답</div>
          <div class="text-lg font-bold text-emerald-700 mt-0.5" id="res-correct">0</div>
        </div>
        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
          <div class="text-xs text-blue-600">정답률</div>
          <div class="text-lg font-bold text-blue-700 mt-0.5" id="res-rate">0%</div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-2 pt-1">
        <button onclick="copyResultReport()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-lg">
          결과 복사하기
        </button>
        <button onclick="openWrongNotes()" class="w-full sm:w-auto bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-xs sm:text-sm px-4 py-2.5 rounded-lg">
          오답노트 보기
        </button>
        <button onclick="startNewQuiz()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-lg">
          다시 풀기
        </button>
      </div>
      <p id="copy-toast" class="text-xs text-emerald-600 font-bold hidden">결과가 복사되었습니다.</p>
    </section>

  </main>

  <!-- 오답 노트 모달 -->
  <div id="wrong-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full max-h-[80vh] flex flex-col shadow-lg overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-bold text-base text-slate-900">오답노트</h3>
        <button onclick="closeWrongNotes()" class="text-slate-400 hover:text-slate-700 font-bold px-2">✕</button>
      </div>
      <div id="wrong-list" class="p-4 overflow-y-auto space-y-3 flex-1 text-sm">
        <p class="text-slate-400 text-center py-8">틀린 문제가 없습니다.</p>
      </div>
      <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
        <button onclick="clearWrongNotes()" class="text-xs text-rose-600 hover:underline font-medium">기록 초기화</button>
        <button onclick="closeWrongNotes()" class="bg-slate-900 text-white text-xs font-bold px-4 py-1.5 rounded-lg">닫기</button>
      </div>
    </div>
  </div>

      const allUnits = ["VII", "VIII", "IX", "X", "XI", "XII"];
      if (selectedUnits.size === allUnits.length) {
        selectedUnits.clear();
      } else {
        allUnits.forEach(u => selectedUnits.add(u));
      }
      updateUnitUI();
    }

    function updateUnitUI() {
      document.querySelectorAll(".unit-chip").forEach(btn => {
        const u = btn.getAttribute("data-unit");
        btn.classList.toggle("active", selectedUnits.has(u));
      });
      document.getElementById("toggle-all-btn").textContent = selectedUnits.size === 6 ? "전체 해제" : "전체 선택";
      document.getElementById("unit-warning").classList.toggle("hidden", selectedUnits.size > 0);
    }

    function setQuestionType(type) {
      questionType = type;
      document.querySelectorAll(".type-btn").forEach(btn => {
        btn.classList.remove("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
        btn.classList.add("text-slate-600", "font-medium");
      });
      const activeBtn = document.getElementById(`type-${type}`);
      activeBtn.classList.add("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
      activeBtn.classList.remove("text-slate-600", "font-medium");
    }

    function setTargetCount(count) {
      targetCount = count;
      document.querySelectorAll(".count-btn").forEach(btn => {
        const c = Number(btn.getAttribute("data-count"));
        if (c === count) {
          btn.classList.add("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
          btn.classList.remove("text-slate-600", "font-medium");
        } else {
          btn.classList.remove("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
          btn.classList.add("text-slate-600", "font-medium");
        }
      });
    }

    function startNewQuiz() {
      if (selectedUnits.size === 0) {
        document.getElementById("unit-warning").classList.remove("hidden");
        return;
      }

      const unitsArr = Array.from(selectedUnits);
      const noticeEl = document.getElementById("pool-notice");
      noticeEl.textContent = "";

      const unitBuckets = {};
      let totalStrictAvailable = 0;

      unitsArr.forEach(u => {
        let strict = QUESTION_BANK.filter(item =>
          item.unit === u && (questionType === "mixed" || item.type === questionType)
        );
        totalStrictAvailable += strict.length;

        const unseen = shuffleArray(strict.filter(q => !recentSeenQuestions.has(q.q)));
        const seen = shuffleArray(strict.filter(q => recentSeenQuestions.has(q.q)));
        unitBuckets[u] = [...unseen, ...seen];
      });

      if (totalStrictAvailable < targetCount) {
        unitsArr.forEach(u => {
          const existingSet = new Set(unitBuckets[u].map(item => item.q));
          const otherTypeItems = shuffleArray(
            QUESTION_BANK.filter(item => item.unit === u && !existingSet.has(item.q))
          );
          unitBuckets[u] = [...unitBuckets[u], ...otherTypeItems];
        });
      }

      const picked = [];
      const usedQuestions = new Set();
      let addedInRound = true;

      while (picked.length < targetCount && addedInRound) {
        addedInRound = false;
        const shuffledUnitsOrder = shuffleArray(unitsArr);
        for (const u of shuffledUnitsOrder) {
          if (picked.length >= targetCount) break;
          while (unitBuckets[u].length > 0) {
            const candidate = unitBuckets[u].shift();
            if (!usedQuestions.has(candidate.q)) {
              usedQuestions.add(candidate.q);
              picked.push(candidate);
              addedInRound = true;
              break;
            }
          }
        }
      }

      const finalItems = shuffleArray(picked);
      if (recentSeenQuestions.size > 50) recentSeenQuestions.clear();
      finalItems.forEach(item => recentSeenQuestions.add(item.q));

      if (finalItems.length < targetCount) {
        noticeEl.textContent = `선택 범위 내 고유 문제 ${finalItems.length}문항이 모두 출제되었습니다.`;
      }

      quizQueue = finalItems.map(baseQ => {
        if (baseQ.type === "mc") {
          const correctText = baseQ.options[baseQ.answer];
          const shuffledOpts = shuffleArray([...baseQ.options]);
          return {
            ...baseQ,
            options: shuffledOpts,
            answer: shuffledOpts.indexOf(correctText)
          };
        }
        return { ...baseQ };
      });

      currentIndex = 0;
      correctCount = 0;

      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("progress-section").classList.remove("hidden");
      document.getElementById("quiz-card").classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      isAnswered = false;
      const item = quizQueue[currentIndex];
      const total = quizQueue.length;
      const num = currentIndex + 1;

      document.getElementById("progress-label").textContent = `${num} / ${total}`;
      document.getElementById("current-unit-tag").textContent = item.unitName;
      document.getElementById("score-correct").textContent = correctCount;
      document.getElementById("progress-bar").style.width = `${(num / total) * 100}%`;

      const typeBadge = document.getElementById("q-type-badge");
      if (item.type === "mc") {
        typeBadge.textContent = "객관식";
        typeBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-700";
      } else {
        typeBadge.textContent = "단답·빈칸";
        typeBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-700";
      }

      document.getElementById("question-text").textContent = `${num}. ${item.q}`;
      document.getElementById("feedback-box").classList.add("hidden");
      document.getElementById("next-action-area").classList.add("hidden");

      const mcArea = document.getElementById("mc-options");
      const saArea = document.getElementById("sa-area");

      if (item.type === "mc") {
        mcArea.classList.remove("hidden");
        saArea.classList.add("hidden");
        mcArea.innerHTML = "";
        const labels = ["①", "②", "③", "④"];
        item.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn w-full text-left p-3.5 rounded-xl border border-slate-200 bg-white font-medium text-sm text-slate-800 flex items-center gap-2.5";
          btn.innerHTML = `<span class="font-bold text-slate-500">${labels[idx]}</span><span>${opt}</span>`;
          btn.onclick = () => checkMcAnswer(idx);
          mcArea.appendChild(btn);
        });
      } else {
        mcArea.classList.add("hidden");
        saArea.classList.remove("hidden");
        const input = document.getElementById("sa-input");
        input.value = "";
        input.disabled = false;
        document.getElementById("sa-submit-btn").disabled = false;
        setTimeout(() => input.focus(), 50);
      }
    }

    function checkMcAnswer(selectedIdx) {
      if (isAnswered) return;
      isAnswered = true;

      const item = quizQueue[currentIndex];
      const isCorrect = selectedIdx === item.answer;
      const buttons = document.querySelectorAll("#mc-options button");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) {
          btn.classList.remove("border-slate-200", "bg-white");
          btn.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-900", "font-bold");
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.remove("border-slate-200", "bg-white");
          btn.classList.add("border-rose-500", "bg-rose-50", "text-rose-900");
        } else {
          btn.classList.add("opacity-50");
        }
      });

      processResult(isCorrect, item.options[selectedIdx], item.options[item.answer]);
    }

    function normalizeText(str) {
      return str
        .toLowerCase()
        .replace(/[\s·\.\-\(\)\[\],'"`]/g, "")
        .trim();
    }

    function submitShortAnswer() {
      if (isAnswered) return;
      const input = document.getElementById("sa-input");
      const rawUser = input.value.trim();
      if (!rawUser) {
        input.focus();
        return;
      }

      isAnswered = true;
      input.disabled = true;
      document.getElementById("sa-submit-btn").disabled = true;

      const item = quizQueue[currentIndex];
      const normUser = normalizeText(rawUser);
      const isCorrect = item.accepted.some(ans => normalizeText(ans) === normUser);

      processResult(isCorrect, rawUser, item.displayAnswer);
    }

    function processResult(isCorrect, userAnsText, correctAnsText) {
      const item = quizQueue[currentIndex];

      if (isCorrect) {
        correctCount++;
      } else {
        wrongNotes.push({
          unitName: item.unitName,
          q: item.q,
          userAns: userAnsText,
          correctAns: correctAnsText,
          explanation: item.explanation,
          tip: item.tip
        });
        updateWrongBadge();
      }

      document.getElementById("score-correct").textContent = correctCount;

      const fbBox = document.getElementById("feedback-box");
      const fbTitle = document.getElementById("feedback-title");
      const fbAnswer = document.getElementById("feedback-answer");

      fbBox.classList.remove("hidden", "bg-emerald-50", "border-emerald-200", "bg-rose-50", "border-rose-200");
      if (isCorrect) {
        fbBox.classList.add("bg-emerald-50", "border-emerald-200");
        fbTitle.textContent = "정답입니다";
        fbTitle.className = "font-bold text-base text-emerald-700";
        fbAnswer.textContent = `정답: ${correctAnsText}`;
        fbAnswer.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800";
      } else {
        fbBox.classList.add("bg-rose-50", "border-rose-200");
        fbTitle.textContent = "오답입니다";
        fbTitle.className = "font-bold text-base text-rose-700";
        fbAnswer.textContent = `정답: ${correctAnsText}`;
        fbAnswer.className = "text-xs font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-800";
      }

      document.getElementById("feedback-explanation").textContent = item.explanation;
      document.getElementById("feedback-tip").textContent = item.tip;

      const nextArea = document.getElementById("next-action-area");
      const nextBtn = document.getElementById("next-btn");
      nextArea.classList.remove("hidden");

      if (currentIndex + 1 >= quizQueue.length) {
        nextBtn.textContent = "결과 보기";
        nextBtn.classList.remove("bg-blue-600", "hover:bg-blue-700");
        nextBtn.classList.add("bg-emerald-600", "hover:bg-emerald-700");
      } else {
        nextBtn.textContent = "다음 문제";
        nextBtn.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
        nextBtn.classList.add("bg-blue-600", "hover:bg-blue-700");
      }
    }

    function handleNextStep() {
      if (currentIndex + 1 >= quizQueue.length) {
        showFinalResult();
      } else {
        currentIndex++;
        renderQuestion();
      }
    }

    function showFinalResult() {
      document.getElementById("quiz-card").classList.add("hidden");
      document.getElementById("progress-section").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      document.getElementById("copy-toast").classList.add("hidden");

      const total = quizQueue.length;
      const rate = Math.round((correctCount / total) * 100);

      document.getElementById("res-total").textContent = `${total}문제`;
      document.getElementById("res-correct").textContent = `${correctCount}개`;
      document.getElementById("res-rate").textContent = `${rate}%`;
    }

    function copyResultReport() {
      const total = quizQueue.length;
      const rate = Math.round((correctCount / total) * 100);
      const unitsStr = Array.from(selectedUnits).join(", ");
      const text = `[중학 사회 1-2 퀴즈 결과]
• 단원: ${unitsStr}
• 점수: ${total}문제 중 ${correctCount}문제 정답 (${rate}%)
• 오답 수: ${wrongNotes.length}개`;

      navigator.clipboard.writeText(text).then(() => {
        document.getElementById("copy-toast").classList.remove("hidden");
      });
    }

    function updateWrongBadge() {
      document.getElementById("wrong-count-badge").textContent = wrongNotes.length;
    }

    function openWrongNotes() {
      const list = document.getElementById("wrong-list");
      if (wrongNotes.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-center py-8">틀린 문제가 없습니다.</p>`;
      } else {
        list.innerHTML = wrongNotes.map((w, i) => `
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-1.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-blue-600">${w.unitName}</span>
              <span class="text-slate-400">#${i + 1}</span>
            </div>
            <p class="font-bold text-slate-900">${w.q}</p>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded">입력: ${w.userAns}</span>
              <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold">정답: ${w.correctAns}</span>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed pt-1">${w.explanation}</p>
          </div>
        `).join("");
      }
      document.getElementById("wrong-modal").classList.remove("hidden");
    }

    function closeWrongNotes() {
      document.getElementById("wrong-modal").classList.add("hidden");
    }

    function clearWrongNotes() {
      wrongNotes = [];
      updateWrongBadge();
      openWrongNotes();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
  </script>
